<!-- Subtle Gloss/Glass Effect Overlay -->
    <linearGradient id="glossGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
        <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
        <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
</defs>

<!-- App Icon Base Shape -->
<rect width="512" height="512" rx="112" fill="url(#bgGradient)"/>
<rect width="512" height="512" rx="112" fill="url(#glossGradient)"/>

<!-- Double Decker Bus Graphic -->
<g filter="url(#shadow)" transform="translate(96, 96)">
    <!-- Bus Body Contour -->
    <rect x="32" y="24" width="256" height="272" rx="36" fill="#FFFFFF"/>
    
    <!-- Upper Windscreen Window -->
    <rect x="48" y="44" width="224" height="68" rx="14" fill="#1E293B"/>
    <!-- Destination Board LED Glow -->
    <rect x="96" y="52" width="128" height="18" rx="4" fill="#FFD100"/>

    <!-- Lower Windscreen Window -->
    <rect x="48" y="128" width="224" height="80" rx="14" fill="#1E293B"/>

    <!-- Headlights -->
    <circle cx="68" cy="240" r="14" fill="#FFD100"/>
    <circle cx="252" cy="240" r="14" fill="#FFD100"/>
    <rect x="104" y="234" width="112" height="12" rx="6" fill="#94A3B8"/>

    <!-- Wheels -->
    <rect x="56" y="286" width="48" height="24" rx="8" fill="#0F172A"/>
    <rect x="216" y="286" width="48" height="24" rx="8" fill="#0F172A"/>

    <!-- Signal Pulse Live Indicator Dot -->
    <circle cx="248" cy="48" r="12" fill="#10B981"/>
    <circle cx="248" cy="48" r="6" fill="#FFFFFF"/>
</g>
